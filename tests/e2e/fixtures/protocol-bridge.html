<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Qshot protocol bridge fixture</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #status { margin-top: 12px; padding: 8px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Compare ↔ Inject Protocol Fixture</h1>
  <button id="send" type="button">Send test query</button>
  <div id="status" data-testid="status">idle</div>
  <iframe id="card" title="mock ai card" src="./mock-inject-page.html"></iframe>

  <script>
    const MSG = { SEARCH: "QSHOT_SEARCH", RESULT: "QSHOT_RESULT" };
    const statusEl = document.getElementById("status");
    const iframe = document.getElementById("card");
    const site = { id: "fixture-chatgpt", name: "Fixture ChatGPT" };

    function setStatus(text) {
      statusEl.textContent = text;
    }

    window.addEventListener("message", (event) => {
      if (event.source !== iframe.contentWindow) return;
      const payload = event.data;
      if (!payload || payload.type !== MSG.RESULT) return;
      setStatus(payload.ok
        ? "result:ok:" + (payload.handlerId || "primary")
        : "result:fail:" + (payload.errorCode || "unknown"));
    });

    document.getElementById("send").addEventListener("click", () => {
      if (!iframe.contentWindow) {
        setStatus("iframe-not-ready");
        return;
      }
      setStatus("dispatching");
      iframe.contentWindow.postMessage({
        type: MSG.SEARCH,
        query: "fixture query",
        site: site,
        requestId: "fixture-req-1",
      }, "*");
    });
  </script>
</body>
</html>
